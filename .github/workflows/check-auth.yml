name: Check YouTube login

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml numpy google-api-python-client google-auth-oauthlib
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_KIDS: ${{ secrets.YT_REFRESH_TOKEN_KIDS }}
          YT_REFRESH_TOKEN_HOLIDAY: ${{ secrets.YT_REFRESH_TOKEN_HOLIDAY }}
          YT_REFRESH_TOKEN_QUIZ: ${{ secrets.YT_REFRESH_TOKEN_QUIZ }}
          YT_REFRESH_TOKEN_COZY: ${{ secrets.YT_REFRESH_TOKEN_COZY }}
        run: python run.py check-auth
