name: Weekly trend report

on:
  schedule:
    - cron: "41 13 * * 1"    # Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml numpy
      - name: Research what's performing
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          for ch in kids holiday quiz; do python run.py trends --channel $ch; done
      - run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add reports/ && git commit -m "trend reports $(date -u +%F)" && git push || echo "no changes"
